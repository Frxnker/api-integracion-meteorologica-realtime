<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Consulta el tiempo actual y el pronóstico de 5 días de cualquier ciudad en tiempo real.">
  <meta name="theme-color" content="#eef3fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070d1c" media="(prefers-color-scheme: dark)">
  <title>Consulta del Tiempo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ilustración reutilizable (logo y estado vacío) -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-sun" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd66b"/>
        <stop offset="1" stop-color="#ff9f43"/>
      </linearGradient>
      <linearGradient id="grad-cloud" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#dbe7f6"/>
      </linearGradient>
    </defs>
    <symbol id="art-sun-cloud" viewBox="0 0 64 64">
      <circle cx="25" cy="24" r="13" fill="url(#grad-sun)"/>
      <path d="M22 51h26a10 10 0 0 0 0-20 13 13 0 0 0-24.6 3.6A8.2 8.2 0 0 0 22 51z" fill="url(#grad-cloud)"/>
    </symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg><use href="#art-sun-cloud"/></svg>
        </div>
        <div class="brand-text">
          <p class="eyebrow">En tiempo real</p>
          <h1>Consulta del Tiempo</h1>
        </div>
      </header>

      <p class="lead">Temperatura, humedad, viento y pronóstico de 5 días para cualquier ciudad del mundo.</p>

      <section class="panel" aria-labelledby="city-label">
        <form id="searchForm" class="search" role="search" novalidate>
          <label id="city-label" for="city" class="panel-title">Buscar ciudad</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="text" id="city" name="city" placeholder="Ej. Madrid, Barcelona, Sevilla" spellcheck="false" enterkeyhint="search">
          </div>

          <div class="actions">
            <button type="button" id="currentWeatherBtn" class="btn btn-primary" data-mode="current" data-label="Tiempo actual">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <span class="btn-label">Tiempo actual</span>
            </button>
            <button type="button" id="forecastWeatherBtn" class="btn btn-secondary" data-mode="forecast" data-label="Pronóstico 5 días">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
              <span class="btn-label">Pronóstico 5 días</span>
            </button>
          </div>

          <div class="suggestions">
            <span class="suggestions-label">Prueba con:</span>
            <button type="button" class="chip" data-city="Madrid">Madrid</button>
            <button type="button" class="chip" data-city="Barcelona">Barcelona</button>
            <button type="button" class="chip" data-city="Sevilla">Sevilla</button>
          </div>
        </form>

        <div id="notification" class="notification hidden" role="status" aria-live="polite"></div>
      </section>

      <p class="credit">Datos proporcionados por <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeather</a></p>
    </aside>

    <main class="content">
      <section id="result" class="results" aria-label="Resultados">
        <div class="empty-state">
          <div class="empty-art" aria-hidden="true">
            <svg><use href="#art-sun-cloud"/></svg>
          </div>
          <h2>Descubre el tiempo en tu ciudad</h2>
          <p>Escribe el nombre de una ciudad y elige <strong>Tiempo actual</strong> o <strong>Pronóstico 5 días</strong>.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
